server:
  port: ${PORT:8082}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: saasy-core
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saasy-core-db}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration

  grpc:
    server:
      port: ${GRPC_PORT:9092}

  cache:
    jcache:
      provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
    cache-names:
      - rate-limit-buckets
    caffeine:
      spec: maximumSize=1000,expireAfterAccess=600s

security:
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
  admin:
    api-key: ${ADMIN_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

invite:
  window-duration-days: 30
  usage-budget-seconds: 1200
  max-validation-attempts: 50

bucket4j:
  enabled: true
  filters:
    - cache-name: rate-limit-buckets
      url: /api/v1/invite-codes/validate
      http-response-body: '{"error": "Too many requests. Please try again later."}'
      rate-limits:
        - cache-key: getRemoteAddr()
          bandwidths:
            - capacity: 5
              time: 1
              unit: minutes

logging:
  level:
    org.flywaydb: DEBUG

management:
  endpoints:
    web:
      base-path: /
  endpoint:
    health:
      enabled: true

springdoc:
  api-docs:
    path: /openapi
  writer-with-default-pretty-printer: true
